name: Hours Report

on:
  push:
    paths:
      - "docs/hours-log.csv"
      - "tools/hours_report.py"
  workflow_dispatch:

jobs:
  hours-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run hours report
        run: |
          python tools/hours_report.py docs/hours-log.csv --budget 240
