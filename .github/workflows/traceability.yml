name: Traceability Check

on:
  push:
    paths:
      - "docs/traceability.csv"
      - "docs/requirements.md"
      - "tools/check-traceability.py"
      - "tools/milestone11_matrix.py"
      - "docs/milestone-11-run.json"
      - "tests/acceptance/test_m11_criteria.py"
      - ".github/workflows/traceability.yml"

  pull_request:
    paths:
      - "docs/traceability.csv"
      - "docs/requirements.md"
      - "tools/check-traceability.py"
      - "tools/milestone11_matrix.py"
      - "docs/milestone-11-run.json"
      - "tests/acceptance/test_m11_criteria.py"

  workflow_dispatch:

jobs:
  check-traceability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run traceability check
        run: python tools/milestone11_matrix.py --check
