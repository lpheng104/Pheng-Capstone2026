name: Requirements Lint

on:
  push:
    paths:
      - "docs/requirements.md"
      - "tools/check_requirements.py"
      - ".github/workflows/requirements-lint.yml"

  pull_request:
    paths:
      - "docs/requirements.md"
      - "tools/check_requirements.py"

  workflow_dispatch:

jobs:
  requirements-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run requirements linter
        run: python tools/check_requirements.py docs/requirements.md
