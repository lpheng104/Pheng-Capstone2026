[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".venv", ".runtime", "node_modules"]

[tool.ruff]
target-version = "py312"
line-length = 110
include = ["src/**/*.py", "script/**/*.py", "tests/test_skeleton.py", "tests/test_iteration1.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
