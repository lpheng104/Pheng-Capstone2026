name: Architecture Spec Check

on:
  push:
    paths:
      - "docs/architecture.md"
      - "docs/requirements.md"
      - "tools/spec-check.py"
      - ".github/workflows/spec-check.yml"

  pull_request:
    paths:
      - "docs/architecture.md"
      - "docs/requirements.md"
      - "tools/spec-check.py"

  workflow_dispatch:

jobs:
  spec-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run architecture specification check
        run: |
          python tools/spec-check.py docs/architecture.md \
            --requirements docs/requirements.md
