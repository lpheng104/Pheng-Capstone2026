<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Accountabilibuddy</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><a class="brand" href="{{ url_for('dashboard') }}">Accountabilibuddy</a><span>UNIT COMMUNICATION & ACCOUNTABILITY</span>{% if current_user %}<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button>Sign out · {{ current_user.name }}</button></form>{% endif %}</header>
<main>{% for message in get_flashed_messages() %}<p class="notice" role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main><footer>Stay connected. Stay accountable.</footer></body></html>
