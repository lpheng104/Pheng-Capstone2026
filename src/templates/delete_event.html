{% extends 'base.html' %}{% block content %}
<!-- AI-assisted 2026-11-01; docs/ai-usage.md. FR-CLNDR-03. -->
<section class="card"><h1>Delete event?</h1><p>Delete “{{ event.title }}” from {{ unit.name }}? Its attendance responses will also be removed.</p>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="primary">Confirm delete event</button></form>
<p><a href="{{ url_for('unit_page', unit_id=unit._id) }}">Cancel — keep this event</a></p></section>{% endblock %}
