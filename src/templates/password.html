{% extends 'base.html' %}{% block content %}
<!-- AI-assisted 2026-11-01; docs/ai-usage.md. FR-ACCT-03. -->
<section class="card auth"><h1>Change password</h1>
<p>Use 8–128 characters, uppercase, lowercase, and one of !@#$%. Changing your password signs out all your sessions.</p>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Current password<input type="password" name="current_password" required maxlength="128" autocomplete="current-password"></label>
<label>New password<input type="password" name="new_password" required maxlength="128" autocomplete="new-password"></label>
<button class="primary">Change password</button></form><p><a href="{{ url_for('dashboard') }}">Cancel</a></p></section>{% endblock %}
