# AI-assisted 2026-11-02; see docs/ai-usage.md.
services:
  - type: web
    name: accountabilibuddy-demo
    runtime: python
    plan: free
    region: ohio
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install --require-hashes -r requirements.lock
    startCommand: gunicorn "src.app:create_app()" --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60 --access-logfile - --error-logfile -
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
